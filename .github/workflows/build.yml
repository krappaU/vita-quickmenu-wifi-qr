name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install qrcode==8.0 pillow==11.0.0
      - run: scripts/test.sh

  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch_deps.sh
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: wifiqr
          path: |
            build/wifiqr.suprx
            build/wifiqr_core.suprx
            build/wifiqr_qm.suprx
            build/wifiqr_kernel.skprx
