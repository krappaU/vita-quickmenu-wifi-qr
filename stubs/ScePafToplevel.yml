# Two functions of the shell's UI library (PAF), called from C by their mangled C++ names (the
# object pointer is the first argument, as for any member function on ARM). NIDs from
# GrapheneCt/ScePaf-RE (lib/ScePafToplevel.emd, SHA-1 of the name + "PAF"); Find's matches the
# 3.65 impose_net_plugin's own import. Linked weakly.
modules:
  ScePafToplevel:
    nid: 0x00000000
    libraries:
      ScePafToplevel:
        kernel: false
        nid: 0x4D9A9DD0
        functions:
          _ZN3paf6Plugin4FindEPKc: 0x004D98CC
          _ZNK3paf6Plugin12GetInterfaceEi: 0x1DF2C6FD
